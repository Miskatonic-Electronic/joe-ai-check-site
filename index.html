<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe AI Checkpoint</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;600;700&display=swap");

    :root {
      --bg: #080c1c;
      --bg-2: #111b3a;
      --surface: rgba(9, 14, 32, 0.76);
      --border: rgba(132, 244, 255, 0.24);
      --text: #e9f3ff;
      --muted: #b3c3d8;
      --glow-cyan: #84f4ff;
      --glow-gold: #ffd772;
      --yes: #00c07f;
      --yes-hover: #00a56d;
      --no: #ff4f6f;
      --no-hover: #e14362;
      --shadow: 0 22px 60px rgba(3, 8, 24, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(132, 244, 255, 0.18), transparent 44%),
        radial-gradient(circle at 88% 80%, rgba(255, 215, 114, 0.22), transparent 44%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: auto;
      width: 42vmax;
      height: 42vmax;
      border-radius: 999px;
      filter: blur(48px);
      z-index: 0;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }

    body::before {
      top: -18vmax;
      left: -10vmax;
      background: radial-gradient(circle, rgba(132, 244, 255, 0.2), transparent 65%);
    }

    body::after {
      bottom: -20vmax;
      right: -8vmax;
      background: radial-gradient(circle, rgba(255, 215, 114, 0.24), transparent 62%);
      animation-delay: 0.3s;
    }

    .spark-grid {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(132, 244, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(132, 244, 255, 0.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.95), transparent 82%);
      pointer-events: none;
    }

    .float-tag {
      position: absolute;
      top: clamp(14px, 2vw, 24px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #05212a;
      font-weight: 700;
      background: linear-gradient(90deg, var(--glow-cyan), #c5ffdd);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 10px 24px rgba(132, 244, 255, 0.34);
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 38px);
      backdrop-filter: blur(14px);
      overflow: hidden;
      animation: reveal 0.8s ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(132, 244, 255, 0.11), transparent 36%, rgba(255, 215, 114, 0.1));
      pointer-events: none;
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Monoton", "Space Grotesk", sans-serif;
      font-size: clamp(1.8rem, 4.6vw, 3.15rem);
      font-weight: 400;
      line-height: 1.25;
      color: #d9efff;
      text-shadow: 0 0 18px rgba(132, 244, 255, 0.24);
      text-wrap: balance;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1rem;
      max-width: 58ch;
    }

    .proof {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 0.82rem;
      color: #0b2735;
      font-weight: 700;
      background: linear-gradient(90deg, rgba(132, 244, 255, 0.95), rgba(255, 215, 114, 0.95));
      padding: 7px 12px;
      border-radius: 999px;
    }

    .proof .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #073b4b;
      box-shadow: 0 0 0 4px rgba(7, 59, 75, 0.18);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 22px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: translateY(1px);
    }

    button::after {
      content: "";
      position: absolute;
      inset: -90% auto auto -20%;
      width: 30%;
      height: 280%;
      transform: rotate(20deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    button:hover::after,
    button:focus-visible::after {
      opacity: 1;
      animation: shine 0.8s ease;
    }

    .yes {
      background: var(--yes);
      box-shadow: 0 10px 24px rgba(0, 192, 127, 0.28);
    }

    .yes:hover,
    .yes:focus-visible {
      background: var(--yes-hover);
      filter: brightness(1.04);
      outline: none;
      box-shadow: 0 14px 28px rgba(0, 192, 127, 0.42);
    }

    .no {
      background: var(--no);
      box-shadow: 0 10px 24px rgba(255, 79, 111, 0.26);
    }

    .no:hover,
    .no:focus-visible {
      background: var(--no-hover);
      filter: brightness(1.04);
      outline: none;
      box-shadow: 0 14px 28px rgba(255, 79, 111, 0.38);
    }

    .score {
      margin-left: auto;
      min-width: 164px;
      text-align: right;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .score strong {
      color: #f3f8ff;
      font-size: 1.16rem;
    }

    .result {
      min-height: 84px;
      background: rgba(8, 18, 42, 0.78);
      border: 1px dashed rgba(132, 244, 255, 0.35);
      border-radius: 14px;
      padding: 15px;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      z-index: 1;
    }

    .placeholder {
      color: var(--muted);
    }

    .result.hot {
      transform: translateY(-2px);
      border-color: rgba(255, 215, 114, 0.75);
      box-shadow: 0 12px 28px rgba(255, 215, 114, 0.18);
    }

    .meter {
      margin-top: 16px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(179, 195, 216, 0.2);
      border: 1px solid rgba(132, 244, 255, 0.18);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00c07f, var(--glow-cyan), var(--glow-gold));
      box-shadow: 0 0 20px rgba(132, 244, 255, 0.34);
      transition: width 0.34s ease;
    }

    .matrix-screen {
      position: fixed;
      inset: 0;
      background: #020503;
      display: none;
      z-index: 999;
    }

    .matrix-screen.active {
      display: block;
    }

    #matrixCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .matrix-label {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #a6ffaf;
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(118, 255, 128, 0.56);
      pointer-events: none;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(2%, -4%, 0) scale(1.06);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shine {
      from {
        transform: translateX(-120%) rotate(20deg);
      }
      to {
        transform: translateX(420%) rotate(20deg);
      }
    }

    @media (max-width: 680px) {
      .actions {
        gap: 10px;
      }

      button {
        flex: 1 1 130px;
      }

      .score {
        margin-left: 0;
        width: 100%;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="spark-grid" aria-hidden="true"></div>
  <div class="float-tag">AI confidence demo</div>

  <main class="card" id="mainCard">
    <h1>have you learned to use AI yet, Joe?</h1>
    <p class="subtitle">
      This is a showcase build. One click and the room knows who is actually shipping with AI.
    </p>
    <div class="proof"><span class="dot"></span>live credibility tracker</div>

    <div class="actions">
      <button class="yes" id="yesBtn">yes</button>
      <button class="no" id="noBtn">no</button>
      <div class="score" id="scoreBox">
        <span>AI mastery score</span>
        <strong id="scoreValue">0%</strong>
      </div>
    </div>

    <section class="result" id="result" aria-live="polite">
      <span class="placeholder">pick an option</span>
    </section>

    <div class="meter" aria-hidden="true">
      <div class="meter-fill" id="meterFill"></div>
    </div>
  </main>

  <section class="matrix-screen" id="matrixScreen" aria-hidden="true">
    <canvas id="matrixCanvas"></canvas>
    <div class="matrix-label">ai mastery unlocked</div>
  </section>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const scoreValue = document.getElementById("scoreValue");
    const meterFill = document.getElementById("meterFill");
    const mainCard = document.getElementById("mainCard");
    const matrixScreen = document.getElementById("matrixScreen");
    const matrixCanvas = document.getElementById("matrixCanvas");

    let score = 0;
    let matrixActive = false;
    let matrixTimer;

    function pulseResult(text) {
      result.textContent = text;
      result.classList.remove("hot");
      void result.offsetWidth;
      result.classList.add("hot");
    }

    function launchMatrix() {
      if (matrixActive) {
        return;
      }

      matrixActive = true;
      mainCard.style.display = "none";
      document.querySelector(".spark-grid").style.display = "none";
      document.querySelector(".float-tag").style.display = "none";
      matrixScreen.classList.add("active");

      const ctx = matrixCanvas.getContext("2d");
      const chars = "01アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴン";
      const fontSize = 16;
      let columns = 0;
      let drops = [];

      function resetMatrix() {
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        columns = Math.floor(matrixCanvas.width / fontSize);
        drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -25));
      }

      function drawFrame() {
        ctx.fillStyle = "rgba(2, 5, 3, 0.12)";
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = "#8cff95";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }

          drops[i] += 1;
        }
      }

      resetMatrix();
      window.addEventListener("resize", resetMatrix);
      matrixTimer = setInterval(drawFrame, 42);
    }

    function updateScore(nextScore) {
      score = Math.max(0, Math.min(100, nextScore));
      scoreValue.textContent = score + "%";
      meterFill.style.width = score + "%";

      if (score >= 100) {
        pulseResult("system override complete. entering matrix mode.");
        launchMatrix();
      }
    }

    yesBtn.addEventListener("click", () => {
      pulseResult("don't lie to me, Joe. send the prompt receipts.");
      updateScore(score + 18);
    });

    noBtn.addEventListener("click", () => {
      pulseResult("another day wasted. i am carrying this team with AI.");
      updateScore(score + 7);
    });
  </script>
</body>
</html>
